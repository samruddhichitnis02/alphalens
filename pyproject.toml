[project]
name = "alphalens"
version = "0.1.0"
description = "Production-grade Investment Research Intelligence over SEC EDGAR Filings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "opensearch-py>=2.6.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "anthropic>=0.28.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "tabulate>=0.9.0",
    "rich>=13.7.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
